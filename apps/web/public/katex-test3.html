<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>KaTeX + react-markdown 测试</title>
  <link rel="stylesheet" href="/node_modules/katex/dist/katex.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.7;
    }
    .katex { line-height: 1.2; }
    .katex, .katex * { box-sizing: content-box; }
  </style>
</head>
<body>
  <h2>react-markdown + remark-math + rehype-katex 测试</h2>
  <div id="root"></div>
  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import ReactMarkdown from 'react-markdown';
    import remarkMath from 'remark-math';
    import remarkGfm from 'remark-gfm';
    import rehypeKatex from 'rehype-katex';

    const content = `## 平均值计算

算术平均值公式：

$$\\bar{x} = \\frac{\\sum_{i=1}^{n} x_i}{n}$$

代入数据：

$$\\bar{x} = \\frac{15.64 + 12.49 + 19.95 + 13.44 + 12.20 + 11.90 + 21.20}{7}$$

$$\\bar{x} = \\frac{106.82}{7} = 15.26$$

行内公式：$x_1 + x_2 + x_3$ 的平均值为 $\\bar{x} = 15.26$。`;

    function App() {
      return React.createElement('div', { className: 'ai-markdown-body' },
        React.createElement(ReactMarkdown, {
          remarkPlugins: [remarkMath, remarkGfm],
          rehypePlugins: [rehypeKatex],
          children: content
        })
      );
    }

    createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
