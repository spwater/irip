<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>KaTeX 纯净测试</title>
  <link rel="stylesheet" href="/node_modules/katex/dist/katex.min.css">
  <script src="/node_modules/katex/dist/katex.min.js"></script>
</head>
<body>
  <h2>纯净环境测试（无全局 CSS）</h2>
  <div id="test1"></div>
  <div id="test2"></div>
  <div id="test3"></div>
  <script>
    katex.render("\\bar{x} = \\frac{\\sum_{i=1}^{n} x_i}{n}", document.getElementById('test1'), {
      displayMode: true,
      throwOnError: false
    });
    katex.render("\\bar{x} = \\frac{15.64 + 12.49 + 19.95 + 13.44 + 12.20 + 11.90 + 21.20}{7} = \\frac{106.82}{7} = 15.26", document.getElementById('test2'), {
      displayMode: true,
      throwOnError: false
    });
    katex.render("行内公式测试：$x_1 + x_2 + x_3$，平均值 $\\bar{x} = \\frac{\\sum x_i}{n}$", document.getElementById('test3'), {
      displayMode: false,
      throwOnError: false
    });
  </script>
</body>
</html>
