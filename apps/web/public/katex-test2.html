<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>KaTeX 带全局CSS测试</title>
  <link rel="stylesheet" href="/node_modules/katex/dist/katex.min.css">
  <script src="/node_modules/katex/dist/katex.min.js"></script>
  <style>
    /* 模拟项目 global.css 的关键样式 */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.7;
    }
    h1, h2, h3, h4, h5, h6 { margin: 0; font-weight: 600; line-height: 1.2; }

    /* KaTeX 隔离 */
    .katex { line-height: 1.2; }
    .katex, .katex * { box-sizing: content-box; }
  </style>
</head>
<body>
  <h2>带全局CSS测试（line-height:1.7 + box-sizing:border-box + KaTeX隔离）</h2>
  <div id="test1"></div>
  <div id="test2"></div>
  <div id="test3"></div>
  <script>
    katex.render("\\bar{x} = \\frac{\\sum_{i=1}^{n} x_i}{n}", document.getElementById('test1'), {
      displayMode: true,
      throwOnError: false
    });
    katex.render("\\bar{x} = \\frac{15.64 + 12.49 + 19.95 + 13.44 + 12.20 + 11.90 + 21.20}{7} = \\frac{106.82}{7} = 15.26", document.getElementById('test2'), {
      displayMode: true,
      throwOnError: false
    });
    katex.render("x_1 + x_2 + x_3, \\bar{x} = \\frac{\\sum x_i}{n}", document.getElementById('test3'), {
      displayMode: false,
      throwOnError: false
    });
  </script>
</body>
</html>
