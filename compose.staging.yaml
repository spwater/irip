# IRIP 预生产（staging）覆盖：本地伪 staging，用于真实同构部署 + k6 压测 + 破坏恢复演练。
#
# 用法：docker compose -f compose.base.yaml -f compose.production.yaml \
#          -f compose.staging.yaml -p irip-staging up -d
#
# 设计要点（与生产完全同构）：
# - 复用 base + production 的 file-backed secret 机制、IRIP_ENV=production、
#   backend(internal) 网络拓扑 —— 后端存储(postgres/redis/minio/api)一律不暴露，
#   只有 web 的 frontend 网络对外，与生产一致。
# - 唯一本地化差异：
#   1. web 暴露高位端口 18080（避免与本机 80 冲突），k6 压测打 http://localhost:18080；
#   2. web 用 nginx-http.conf（无 TLS），避免本地自签名证书告警（生产用 nginx-tls.conf + 443）。
# - seed / psql / mc 等运维操作一律用 `docker compose exec` 进容器，不暴露后端端口。
# - 通过 -p irip-staging 隔离命名卷（irip-staging_pgdata 等），绝不碰 dev/test/drill 数据。
services:
  api:
    environment:
      IRIP_STAGING: "1"
      # AI 网关 key 走环境变量注入（models.yaml 用 ${IRIP_LLM_HCRDI_API_KEY} 占位符）
      IRIP_LLM_HCRDI_API_KEY: ${IRIP_LLM_HCRDI_API_KEY:?IRIP_LLM_HCRDI_API_KEY is required in .env}
      # superuser 连接串（删除项目时需 DISABLE TRIGGER，irip_app 无权操作）
      IRIP_DATABASE_ADMIN_URL_FILE: /run/secrets/database_admin_url
      # 开启研究分析功能（staging 试用需要）
      RESEARCH_ANALYSIS_ENABLED: "true"
      # staging 需要访问内网 LLM 网关（10.1.2.1:18881），放开 SSRF 私网限制
      IRIP_ALLOW_PRIVATE_NETWORK: "1"
    secrets:
      - source: irip_database_admin_url
        target: database_admin_url
    volumes:
      - ./config:/app/config:ro
    # api 需要访问外部 LLM 网关（10.1.2.1:18881），但 backend 网络 internal:true
    # 禁止外网访问。加 frontend 网络让 api 能出网（不暴露端口，仅做出站路由）。
    networks:
      - frontend
      - backend
  worker:
    environment:
      IRIP_STAGING: "1"
      IRIP_LLM_HCRDI_API_KEY: ${IRIP_LLM_HCRDI_API_KEY:?IRIP_LLM_HCRDI_API_KEY is required in .env}
      IRIP_DATABASE_ADMIN_URL_FILE: /run/secrets/database_admin_url
      IRIP_ALLOW_PRIVATE_NETWORK: "1"
    secrets:
      - source: irip_database_admin_url
        target: database_admin_url
    # worker 需要访问外部 LLM 网关（10.1.2.1:18881），但 backend 网络 internal:true
    # 禁止外网访问。加 frontend 网络让 worker 能出网（不暴露端口，仅做出站路由）。
    networks:
      - backend
      - frontend
    volumes:
      - ./config:/app/config:ro
  scheduler:
    environment:
      IRIP_STAGING: "1"
      IRIP_LLM_HCRDI_API_KEY: ${IRIP_LLM_HCRDI_API_KEY:?IRIP_LLM_HCRDI_API_KEY is required in .env}
      IRIP_ALLOW_PRIVATE_NETWORK: "1"
    volumes:
      - ./config:/app/config:ro
    networks:
      - backend
      - frontend
  web:
    environment:
      NGINX_CONF: "nginx-http.conf"
    ports:
      - "18080:80"
  # bootstrap 是一次性运维容器，仅在首次部署时需要。
  # 加 profile 防止 `docker compose restart/up` 时自动拉起（restart 不尊重 depends_on
  # 时序，会导致 PG 还在重启就连接，报 password auth failed）。
  # 显式运行：docker compose ... --profile ops up bootstrap
  bootstrap:
    profiles: ["ops"]
    environment:
      IRIP_STAGING: "1"
      IRIP_LLM_HCRDI_API_KEY: ${IRIP_LLM_HCRDI_API_KEY:?IRIP_LLM_HCRDI_API_KEY is required in .env}
  # backup/restore 同样需要跳过 Windows secret 权限检查
  backup:
    environment:
      IRIP_STAGING: "1"
  restore:
    environment:
      IRIP_STAGING: "1"
