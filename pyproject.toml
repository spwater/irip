# IRIP 平台 Python 项目配置
# 说明：
# - requires-python 放开上限以兼容本机 Python 3.13（见 docs/arch-v0.md §1.4）
# - 行宽 100、target py312，与架构文档 §6.1 对齐
[project]
name = "irip-platform"
version = "0.1.0"
description = "Industrial Research Intelligence Platform (IRIP) — Phase V0 Platform Skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "celery>=5.4,<6",
  "redis>=5,<6",
  "boto3>=1.35,<2",
  "pyjwt>=2.9,<3",
  "argon2-cffi>=23,<24",
  "cryptography>=44",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "structlog>=24,<26",
  "prometheus-client>=0.20,<1",
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "pymupdf>=1.24,<2",
  "pdfplumber>=0.11,<1",
  "sqlparse>=0.5,<1",
  "tabulate>=0.9,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "hypothesis>=6.112,<7",
  "testcontainers[postgres,redis,minio]>=4.8,<5",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

# ---- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: 需要真实外部依赖（数据库/对象存储）的集成测试",
  "slow: 运行较慢的测试",
  "acceptance: V1 验收不变量测试",
]

# ---- coverage (F-17) ----
[tool.coverage.run]
source = ["packages", "apps"]
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "*/migrations/*",
  "*/.venv/*",
]
branch = true

[tool.coverage.report]
fail_under = 30
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "pass",
  "if TYPE_CHECKING:",
]

# ---- ruff ----
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "node_modules", "apps/web"]

[tool.ruff.lint]
# F821 = undefined-name（F-14/F-24：必须清零，CI 阻断门）
# E = pycodestyle errors（F-24：清零 E 类违规）
select = ["E", "F", "I", "W", "UP", "B", "ASYNC", "C4"]
ignore = []

# ---- mypy（strict 模式；common 内核必须 0 errors）----
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
exclude = ["^\\.venv/", "^apps/web/", "^node_modules/"]
plugins = []

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "testcontainers.*", "celery.*"]
ignore_missing_imports = true

# ---- uv / pip 国内镜像（架构文档 §1.4）----
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.dependency-groups]
dev = []
