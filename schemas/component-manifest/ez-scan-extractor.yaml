name: ez_scan_extractor
version: "1.3.1"
kind: ingestion
runtime: python
description: "LLM 驱动的文档提取组件，从 PDF/文本文件中提取结构化数据。大模型全包，输出列由 LLM 决定。"
inputs: []
outputs:
  - name: observations
    data_type: observation_table
    required: true
    schema: {}
parameters:
  type: object
  required: []
  properties:
    path:
      type: string
      description: "文件路径（PDF 或文本文件），发布时可留空，创建执行时填入"
    prompt:
      type: string
      description: "提取指令，告诉 LLM 要从文件中提取什么数据"
      default: "提取报告头部信息（分析类型、分析日期、样品名、文件名）和所有检测结果（编号、组分、单位、结果）。头部信息单独放在 header 字段里，检测列表放在 rows 字段里。"
    system_message:
      type: string
      description: "LLM system message，定义大模型的角色和输出格式要求"
      default: "你是一个工业数据分析助手。根据用户提供的报告内容，提取头部信息和所有检测结果。返回JSON格式：{\"header\": {\"analysis_type\": \"...\", \"analysis_date\": \"...\", \"sample_name\": \"...\", \"file_name\": \"...\"}, \"rows\": [{\"No.\": 1, \"组分\": \"...\", \"单位\": \"...\", \"结果\": 0.0}, ...]}。只返回JSON，不要解释。"
    pdf_engine:
      type: string
      description: "PDF 读取引擎：pymupdf（文字层提取）、image（渲染图片发给多模态大模型识别）、raw（直接当文本读）"
      default: "pymupdf"
    image_dpi:
      type: integer
      description: "image 模式下 PDF 渲染分辨率（DPI），150够用/200平衡/300高清"
      default: 200
    max_content_chars:
      type: integer
      description: "发送给 LLM 的最大内容字符数，超出则截断"
      default: 50000
    timeout:
      type: integer
      description: "LLM HTTP 调用超时秒数（区别于 timeout_seconds 组件总超时）"
      default: 120
timeout_seconds: 300
network_policy:
  allowed_hosts: []
