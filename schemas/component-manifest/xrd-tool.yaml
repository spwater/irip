name: xrd_tool
version: "1.0.0"
kind: ingestion
runtime: python
description: "XRD RAS_RAW 文件确定性解析工具。调用 Python 解析器将 Rigaku SmartLab RAS_RAW 原始文件转换为 {metadata, points, series} 结构化数据，不依赖 LLM。"
inputs: []
outputs:
  - name: observations
    data_type: observation_table
    required: true
    schema: {}
parameters:
  type: object
  required: []
  properties:
    path:
      type: string
      description: "文件路径，执行时上传"
    tool_name:
      type: string
      description: "使用的解析工具名称"
      default: "convert_xrd_file_to_json"
timeout_seconds: 300
network_policy:
  allowed_hosts: []
