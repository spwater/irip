name: excel_reader
version: 1.0.0
kind: ingestion
runtime: python
description: "使用 openpyxl 读取 .xlsx 文件，输出 ObservationTable。"
timeout_seconds: 120
inputs: []
outputs:
  - name: observations
    data_type: observation_table
    required: true
parameters:
  type: object
  required:
    - path
  properties:
    path:
      type: string
      description: "xlsx 文件路径"
    sheet_name:
      type: string
      description: "工作表名称（可选，默认第一个）"
    header_row:
      type: integer
      minimum: 1
      default: 1
    data_start_row:
      type: integer
      minimum: 1
