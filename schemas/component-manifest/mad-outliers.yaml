name: mad_outliers
version: 1.0.0
kind: transform
runtime: python
description: "MAD 异常值检测（标记不删除）。"
timeout_seconds: 120
inputs:
  - name: observations
    data_type: observation_table
    required: true
outputs:
  - name: observations
    data_type: observation_table
    required: true
  - name: diagnostics
    data_type: diagnostic_report
    required: false
parameters:
  type: object
  required:
    - columns
  properties:
    columns:
      type: array
      items:
        type: string
    threshold:
      type: number
      exclusiveMinimum: 0
      default: 3.5
