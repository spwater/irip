# IRIP 开发覆盖：暴露内部服务端口到宿主机，便于本机调试
# 用法：docker compose -f compose.base.yaml -f compose.development.yaml up -d
#
# 仅用于本地开发。密码从项目根目录 .env 读取（docker compose 自动加载）。
# IRIP_ENV=development，并暴露 postgres/redis/minio/api/web 端口。
services:
  postgres:
    ports:
      - "5432:5432"
    environment:
      # 第6缺陷：开发环境无 secret 文件，注入 superuser 密码（env 生效）。
      POSTGRES_PASSWORD: ${IRIP_DATABASE_PASSWORD:?IRIP_DATABASE_PASSWORD is required}
      # 清空 base.yaml 的 _FILE：postgres 官方镜像两者互斥（同设报错），
      # dev 走 env、生产走 file，必须显式置空其一。
      POSTGRES_PASSWORD_FILE: ""

  redis:
    ports:
      - "6379:6379"
    environment:
      # 层次2：开发环境无 secret 文件，redis entrypoint shim 回退到该环境变量。
      IRIP_REDIS_PASSWORD: ${IRIP_REDIS_PASSWORD:-irip_dev_password}

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      # 层次2：开发环境无 secret 文件，注入 root 密码（minio 优先采用环境变量）。
      MINIO_ROOT_PASSWORD: ${IRIP_MINIO_SECRET_KEY:-irip_dev_password}

  api:
    ports:
      - "8000:8000"
    environment:
      IRIP_ENV: "development"

  worker:
    environment:
      IRIP_ENV: "development"

  scheduler:
    environment:
      IRIP_ENV: "development"

  web:
    ports:
      - "8080:80"
    environment:
      NGINX_CONF: "nginx-http.conf"

# 开发环境覆盖：backend 网络关闭 internal。
# base.yaml 的 backend internal:true 是生产安全设计（后端存储不暴露宿主机端口）。
# 但开发环境 dev.sh 用宿主机 uvicorn/celery/vite 直连 localhost:5432/6379/9000，
# 依赖这些基础设施容器的端口发布；internal 网络会阻断端口发布，故开发必须关闭。
# 生产环境（compose.production.yaml）不覆盖此项，保持 internal 隔离不变。
networks:
  backend:
    internal: false
