# IRIP Web Nginx 配置
# - SPA fallback: try_files $uri $uri/ /index.html
# - /api/ 反代到 api:8000
# - CSP: 限制 script/style/img/font 来源，防止 XSS（H-14 DOM XSS 修复配套）

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy：
    # - script-src 'self': 仅允许同源 JS（阻止 inline script / eval / 外部 CDN 脚本）
    # - style-src 'self' 'unsafe-inline': 允许 inline style（KaTeX 渲染需要）
    # - img-src 'self' data: blob:: 允许同源图片 + data URI（echarts/plotly 图表）
    # - font-src 'self': 仅允许同源字体（KaTeX woff2）
    # - connect-src 'self': 仅允许同源 API 调用（阻止 XSS 外传数据）
    # - object-src 'none': 禁止 <object>/<embed>/<applet>
    # - base-uri 'self': 限制 <base> 标签
    # - frame-ancestors 'none': 禁止被嵌入 iframe（防点击劫持）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # index.html 不缓存（确保浏览器每次都拿到最新的 JS/CSS hash）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA 前端路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持（作业事件流）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
