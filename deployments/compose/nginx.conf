# IRIP Web Nginx 配置
# - TLS/HTTPS: 443 端口 + HTTP→HTTPS 重定向（生产环境）
# - SPA fallback: try_files $uri $uri/ /index.html
# - /api/ 反代到 api:8000
# - 安全响应头: HSTS, X-Content-Type-Options, X-Frame-Options, CSP
# - CSP: 限制 script/style/img/font 来源，防止 XSS（H-14 DOM XSS 修复配套）

# ---- HTTP → HTTPS 重定向（生产环境启用 TLS 时）----
server {
    listen 80;
    server_name _;
    # 若 TLS 启用，重定向到 HTTPS；否则直接服务 HTTP
    return 301 https://$host$request_uri;
}

# ---- HTTPS 主服务 ----
server {
    listen 443 ssl;
    server_name _;

    # TLS 证书路径（通过 Docker volume 或 secrets 挂载）
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # TLS 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # ---- gzip 压缩 ----
    # 大体积 JS 产物（plotly ~4.8MB / antd ~1.3MB / g6 ~1.4MB）未压缩状态传输非常浪费，
    # 开启 gzip 后 plotly 降至 ~1.5MB。文本类资源（js/css/json/svg）统一压缩。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/x-javascript
        image/svg+xml;

    # ---- 安全响应头 ----
    # HSTS: 强制浏览器后续使用 HTTPS（max-age=2年，含子域名）
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    # 禁止被嵌入 iframe（防点击劫持，CSP frame-ancestors 的补充）
    add_header X-Frame-Options "DENY" always;
    # XSS 过滤（旧版浏览器兼容）
    add_header X-XSS-Protection "1; mode=block" always;
    # Referrer 策略：仅发送同源 origin
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy：
    # - script-src 'self': 仅允许同源 JS（阻止 inline script / eval / 外部 CDN 脚本）
    # - style-src 'self' 'unsafe-inline': 允许 inline style（KaTeX 渲染需要）
    # - img-src 'self' data: blob:: 允许同源图片 + data URI（echarts/plotly 图表）
    # - font-src 'self': 仅允许同源字体（KaTeX woff2）
    # - connect-src 'self': 仅允许同源 API 调用（阻止 XSS 外传数据）
    # - object-src 'none': 禁止 <object>/<embed>/<applet>
    # - base-uri 'self': 限制 <base> 标签
    # - frame-ancestors 'none': 禁止被嵌入 iframe（防点击劫持）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # index.html 不缓存（确保浏览器每次都拿到最新的 JS/CSS hash）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA 前端路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持（作业事件流）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
