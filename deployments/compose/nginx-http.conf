# IRIP Web Nginx 配置（开发环境，HTTP-only）
# - 仅 listen 80，无 HTTPS / 无重定向
# - SPA fallback: try_files $uri $uri/ /index.html
# - /api/ 反代到 api:8000
# - 安全响应头（不含 HSTS，因为无 TLS）

server {
    listen 80;
    server_name _;

    # Docker 内置 DNS 解析器（用于运行时解析 api 等服务名）
    resolver 127.0.0.11 valid=30s;

    root /usr/share/nginx/html;
    index index.html;

    # ---- gzip 压缩 ----
    # 大体积 JS 产物（plotly ~4.8MB / antd ~1.3MB / g6 ~1.4MB）未压缩状态传输非常浪费，
    # 开启 gzip 后 plotly 降至 ~1.5MB。文本类资源（js/css/json/svg）统一压缩。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/x-javascript
        image/svg+xml;

    # ---- 安全响应头 ----
    # 注意：开发环境不含 HSTS（无 TLS）
    # 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    # 禁止被嵌入 iframe（防点击劫持）
    add_header X-Frame-Options "DENY" always;
    # XSS 过滤（旧版浏览器兼容）
    add_header X-XSS-Protection "1; mode=block" always;
    # Referrer 策略：仅发送同源 origin
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy（与生产一致，开发环境也保持安全基线）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # index.html 不缓存（确保浏览器每次都拿到最新的 JS/CSS hash）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA 前端路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    # 使用变量 + resolver 延迟 DNS 解析到请求时，避免 nginx -t 在无 DNS 环境下失败
    location /api/ {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持（作业事件流）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
