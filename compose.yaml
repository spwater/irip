# IRIP 生产编排（全量服务）
# 用法：docker compose up --build -d
# 镜像固定 tag（架构文档 §6.3），Docker registry mirror 走 daocloud。
# 环境变量从 .env 读取。
#
# H-12/H-13 安全增强：
# - IRIP_SAFE_CLI_MODE=true（CLI 组件沙箱）
# - Redis 加密码
# - 内部服务不暴露宿主端口（postgres/redis/minio 仅 internal）
# - 统一 cap_drop/no-new-privileges/只读 FS 安全基线

# H-13: 应用服务安全基线（不适用于基础设施 postgres/redis/minio，它们需要写权限）
x-security-base: &security-base
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges"]
  read_only: true
  tmpfs:
    - /tmp

# 基础设施不需要应用层安全限制（它们是受信任的内部服务）
x-infra-security: &infra-security {}

services:
  postgres:
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    # PITR: 通过 command 参数注入 WAL 归档配置（无需修改 postgresql.conf）
    command: >
      postgres
      -c archive_mode=on
      -c wal_level=replica
      -c archive_command='test ! -f /backups/wal_archive/%f && cp %p /backups/wal_archive/%f'
      -c max_wal_senders=3
    environment:
      POSTGRES_USER: ${IRIP_DATABASE_USER:-irip}
      POSTGRES_PASSWORD: ${IRIP_DATABASE_PASSWORD:?IRIP_DATABASE_PASSWORD is required}
      POSTGRES_DB: ${IRIP_DATABASE_NAME:-irip}
    # 开发环境临时暴露端口
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgrun:/var/run/postgresql
      # PITR: WAL 归档目录（archive_command 写入此处）
      - ${IRIP_WAL_ARCHIVE_HOST_DIR:-./backups/wal_archive}:/backups/wal_archive
      # PITR: 备份目录（PG 容器需访问 basebackup 产物 + WAL 归档）
      - ${IRIP_BACKUP_HOST_DIR:-./backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IRIP_DATABASE_USER:-irip} -d ${IRIP_DATABASE_NAME:-irip}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: docker.m.daocloud.io/redis:7-alpine
    <<: *infra-security
    # H-13: Redis 加密码
    command: ["redis-server", "--requirepass", "${IRIP_REDIS_PASSWORD:?IRIP_REDIS_PASSWORD is required}"]
    # 开发环境临时暴露端口
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${IRIP_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: docker.m.daocloud.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    <<: *infra-security
    command: server /data --console-address ":9001"
    # 开发环境临时暴露端口
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${IRIP_MINIO_ACCESS_KEY:-irip}
      MINIO_ROOT_PASSWORD: ${IRIP_MINIO_SECRET_KEY:?IRIP_MINIO_SECRET_KEY is required}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deployments/compose/api.Dockerfile
    <<: *security-base
    environment:
      IRIP_DATABASE_URL: postgresql+psycopg://${IRIP_DATABASE_USER:-irip}:${IRIP_DATABASE_PASSWORD:?IRIP_DATABASE_PASSWORD is required}@postgres:5432/${IRIP_DATABASE_NAME:-irip}
      IRIP_REDIS_URL: redis://:${IRIP_REDIS_PASSWORD:?IRIP_REDIS_PASSWORD is required}@redis:6379/0
      IRIP_CELERY_BROKER_URL: redis://:${IRIP_REDIS_PASSWORD}@redis:6379/0
      IRIP_CELERY_RESULT_BACKEND: redis://:${IRIP_REDIS_PASSWORD}@redis:6379/1
      IRIP_MINIO_ENDPOINT: http://minio:9000
      IRIP_MINIO_ACCESS_KEY: ${IRIP_MINIO_ACCESS_KEY:-irip}
      IRIP_MINIO_SECRET_KEY: ${IRIP_MINIO_SECRET_KEY:?IRIP_MINIO_SECRET_KEY is required}
      IRIP_MINIO_BUCKET: ${IRIP_MINIO_BUCKET:-irip-artifacts}
      IRIP_MINIO_REGION: ${IRIP_MINIO_REGION:-us-east-1}
      IRIP_JWT_SECRET: ${IRIP_JWT_SECRET:?IRIP_JWT_SECRET is required}
      IRIP_API_CORS_ORIGINS: ${IRIP_API_CORS_ORIGINS:-http://localhost:8080}
      IRIP_BOOTSTRAP_ADMIN_PASSWORD: ${IRIP_BOOTSTRAP_ADMIN_PASSWORD:?IRIP_BOOTSTRAP_ADMIN_PASSWORD is required}
      IRIP_ALLOW_PRIVATE_NETWORK: ${IRIP_ALLOW_PRIVATE_NETWORK:-0}
      IRIP_MASTER_KEY: ${IRIP_MASTER_KEY:?IRIP_MASTER_KEY is required}
      IRIP_SAFE_CLI_MODE: "true"
      IRIP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deployments/compose/api.Dockerfile
    <<: *security-base
    command: ["celery", "-A", "apps.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      IRIP_DATABASE_URL: postgresql+psycopg://${IRIP_DATABASE_USER:-irip}:${IRIP_DATABASE_PASSWORD:?IRIP_DATABASE_PASSWORD is required}@postgres:5432/${IRIP_DATABASE_NAME:-irip}
      IRIP_REDIS_URL: redis://:${IRIP_REDIS_PASSWORD:?IRIP_REDIS_PASSWORD is required}@redis:6379/0
      IRIP_CELERY_BROKER_URL: redis://:${IRIP_REDIS_PASSWORD}@redis:6379/0
      IRIP_CELERY_RESULT_BACKEND: redis://:${IRIP_REDIS_PASSWORD}@redis:6379/1
      IRIP_MINIO_ENDPOINT: http://minio:9000
      IRIP_MINIO_ACCESS_KEY: ${IRIP_MINIO_ACCESS_KEY:-irip}
      IRIP_MINIO_SECRET_KEY: ${IRIP_MINIO_SECRET_KEY:?IRIP_MINIO_SECRET_KEY is required}
      IRIP_MINIO_BUCKET: ${IRIP_MINIO_BUCKET:-irip-artifacts}
      IRIP_MINIO_REGION: ${IRIP_MINIO_REGION:-us-east-1}
      IRIP_JWT_SECRET: ${IRIP_JWT_SECRET:?IRIP_JWT_SECRET is required}
      IRIP_ALLOW_PRIVATE_NETWORK: ${IRIP_ALLOW_PRIVATE_NETWORK:-0}
      IRIP_MASTER_KEY: ${IRIP_MASTER_KEY:?IRIP_MASTER_KEY is required}
      IRIP_SAFE_CLI_MODE: "true"
      IRIP_ENV: production
      IRIP_BACKUP_OUTPUT_DIR: ${IRIP_BACKUP_OUTPUT_DIR:-/backups}
      IRIP_BACKUP_AGE_RECIPIENT: ${IRIP_BACKUP_AGE_RECIPIENT:-}
      # PITR + mc mirror 相关环境变量
      IRIP_WAL_ARCHIVE_DIR: ${IRIP_WAL_ARCHIVE_DIR:-/backups/wal_archive}
      IRIP_MINIO_MC_ALIAS: ${IRIP_MINIO_MC_ALIAS:-irip}
      IRIP_PG_REPLICATION_SLOT: ${IRIP_PG_REPLICATION_SLOT:-}
      IRIP_MINIO_MIRROR_EXCLUDE: ${IRIP_MINIO_MIRROR_EXCLUDE:-}
    volumes:
      - ${IRIP_BACKUP_HOST_DIR:-./backups}:/backups
      # PITR: WAL 归档目录（备份/恢复需访问）
      - ${IRIP_WAL_ARCHIVE_HOST_DIR:-./backups/wal_archive}:/backups/wal_archive
      # PITR: Docker socket（恢复需控制 PG 容器 stop/start）
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9100/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: deployments/compose/api.Dockerfile
    <<: *security-base
    command: ["celery", "-A", "apps.worker.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      IRIP_DATABASE_URL: postgresql+psycopg://${IRIP_DATABASE_USER:-irip}:${IRIP_DATABASE_PASSWORD:?IRIP_DATABASE_PASSWORD is required}@postgres:5432/${IRIP_DATABASE_NAME:-irip}
      IRIP_REDIS_URL: redis://:${IRIP_REDIS_PASSWORD:?IRIP_REDIS_PASSWORD is required}@redis:6379/0
      IRIP_CELERY_BROKER_URL: redis://:${IRIP_REDIS_PASSWORD}@redis:6379/0
      IRIP_CELERY_RESULT_BACKEND: redis://:${IRIP_REDIS_PASSWORD}@redis:6379/1
      IRIP_MINIO_ENDPOINT: http://minio:9000
      IRIP_MINIO_ACCESS_KEY: ${IRIP_MINIO_ACCESS_KEY:-irip}
      IRIP_MINIO_SECRET_KEY: ${IRIP_MINIO_SECRET_KEY:?IRIP_MINIO_SECRET_KEY is required}
      IRIP_MINIO_BUCKET: ${IRIP_MINIO_BUCKET:-irip-artifacts}
      IRIP_MINIO_REGION: ${IRIP_MINIO_REGION:-us-east-1}
      IRIP_JWT_SECRET: ${IRIP_JWT_SECRET:?IRIP_JWT_SECRET is required}
      IRIP_ALLOW_PRIVATE_NETWORK: ${IRIP_ALLOW_PRIVATE_NETWORK:-0}
      IRIP_MASTER_KEY: ${IRIP_MASTER_KEY:?IRIP_MASTER_KEY is required}
      IRIP_SAFE_CLI_MODE: "true"
      IRIP_ENV: production
      IRIP_BACKUP_OUTPUT_DIR: ${IRIP_BACKUP_OUTPUT_DIR:-/backups}
      # PITR + mc mirror 相关环境变量
      IRIP_WAL_ARCHIVE_DIR: ${IRIP_WAL_ARCHIVE_DIR:-/backups/wal_archive}
      IRIP_MINIO_MC_ALIAS: ${IRIP_MINIO_MC_ALIAS:-irip}
      IRIP_PG_REPLICATION_SLOT: ${IRIP_PG_REPLICATION_SLOT:-}
      IRIP_MINIO_MIRROR_EXCLUDE: ${IRIP_MINIO_MIRROR_EXCLUDE:-}
    volumes:
      - ${IRIP_BACKUP_HOST_DIR:-./backups}:/backups
      # PITR: WAL 归档目录（beat 任务可能需要查询 WAL 状态）
      - ${IRIP_WAL_ARCHIVE_HOST_DIR:-./backups/wal_archive}:/backups/wal_archive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule && find /tmp/celerybeat-schedule -mmin -2 | grep -q . || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deployments/compose/web.Dockerfile
    <<: *security-base
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  bootstrap:
    build:
      context: .
      dockerfile: deployments/compose/api.Dockerfile
    <<: *security-base
    # 先跑 alembic 迁移建表，再跑 bootstrap 创建组织+角色+管理员+bucket
    command: ["sh", "-c", "alembic upgrade head && python -m deployments.compose.bootstrap"]
    environment:
      IRIP_DATABASE_URL: postgresql+psycopg://${IRIP_DATABASE_USER:-irip}:${IRIP_DATABASE_PASSWORD:?IRIP_DATABASE_PASSWORD is required}@postgres:5432/${IRIP_DATABASE_NAME:-irip}
      IRIP_REDIS_URL: redis://:${IRIP_REDIS_PASSWORD:?IRIP_REDIS_PASSWORD is required}@redis:6379/0
      IRIP_MINIO_ENDPOINT: http://minio:9000
      IRIP_MINIO_ACCESS_KEY: ${IRIP_MINIO_ACCESS_KEY:-irip}
      IRIP_MINIO_SECRET_KEY: ${IRIP_MINIO_SECRET_KEY:?IRIP_MINIO_SECRET_KEY is required}
      IRIP_MINIO_BUCKET: ${IRIP_MINIO_BUCKET:-irip-artifacts}
      IRIP_MINIO_REGION: ${IRIP_MINIO_REGION:-us-east-1}
      IRIP_JWT_SECRET: ${IRIP_JWT_SECRET:?IRIP_JWT_SECRET is required}
      IRIP_BOOTSTRAP_ADMIN_PASSWORD: ${IRIP_BOOTSTRAP_ADMIN_PASSWORD:?IRIP_BOOTSTRAP_ADMIN_PASSWORD is required}
      IRIP_MASTER_KEY: ${IRIP_MASTER_KEY:?IRIP_MASTER_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

  backup:
    profiles: ["dangerous-ops"]
    build:
      context: .
      dockerfile: deployments/compose/api.Dockerfile
    <<: *security-base
    command: ["python", "-m", "deployments.compose.backup"]
    environment:
      IRIP_DATABASE_URL: postgresql+psycopg://${IRIP_DATABASE_USER:-irip}:${IRIP_DATABASE_PASSWORD:?IRIP_DATABASE_PASSWORD is required}@postgres:5432/${IRIP_DATABASE_NAME:-irip}
      IRIP_REDIS_URL: redis://:${IRIP_REDIS_PASSWORD:?IRIP_REDIS_PASSWORD is required}@redis:6379/0
      IRIP_MINIO_ENDPOINT: http://minio:9000
      IRIP_MINIO_ACCESS_KEY: ${IRIP_MINIO_ACCESS_KEY:-irip}
      IRIP_MINIO_SECRET_KEY: ${IRIP_MINIO_SECRET_KEY:?IRIP_MINIO_SECRET_KEY is required}
      IRIP_MINIO_BUCKET: ${IRIP_MINIO_BUCKET:-irip-artifacts}
      IRIP_MINIO_REGION: ${IRIP_MINIO_REGION:-us-east-1}
      IRIP_APPLICATION_VERSION: ${IRIP_APPLICATION_VERSION:-0.1.0}
      IRIP_BACKUP_OUTPUT_DIR: ${IRIP_BACKUP_OUTPUT_DIR:-/backups}
      IRIP_BACKUP_AGE_RECIPIENT: ${IRIP_BACKUP_AGE_RECIPIENT:-}
      # PITR + mc mirror 相关环境变量
      IRIP_WAL_ARCHIVE_DIR: ${IRIP_WAL_ARCHIVE_DIR:-/backups/wal_archive}
      IRIP_MINIO_MC_ALIAS: ${IRIP_MINIO_MC_ALIAS:-irip}
      IRIP_PG_REPLICATION_SLOT: ${IRIP_PG_REPLICATION_SLOT:-}
      IRIP_MINIO_MIRROR_EXCLUDE: ${IRIP_MINIO_MIRROR_EXCLUDE:-}
    volumes:
      - ${IRIP_BACKUP_HOST_DIR:-./backups}:/backups
      # PITR: WAL 归档目录（备份时可能需要查询 WAL 状态）
      - ${IRIP_WAL_ARCHIVE_HOST_DIR:-./backups/wal_archive}:/backups/wal_archive
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

  restore:
    profiles: ["dangerous-ops"]
    build:
      context: .
      dockerfile: deployments/compose/api.Dockerfile
    <<: *security-base
    command: ["python", "-m", "deployments.compose.restore", "--backup-dir", "${IRIP_RESTORE_BACKUP_DIR:-/backups}"]
    environment:
      IRIP_DATABASE_URL: postgresql+psycopg://${IRIP_DATABASE_USER:-irip}:${IRIP_DATABASE_PASSWORD:?IRIP_DATABASE_PASSWORD is required}@postgres:5432/${IRIP_DATABASE_NAME:-irip}
      IRIP_REDIS_URL: redis://:${IRIP_REDIS_PASSWORD:?IRIP_REDIS_PASSWORD is required}@redis:6379/0
      IRIP_MINIO_ENDPOINT: http://minio:9000
      IRIP_MINIO_ACCESS_KEY: ${IRIP_MINIO_ACCESS_KEY:-irip}
      IRIP_MINIO_SECRET_KEY: ${IRIP_MINIO_SECRET_KEY:?IRIP_MINIO_SECRET_KEY is required}
      IRIP_MINIO_BUCKET: ${IRIP_MINIO_BUCKET:-irip-artifacts}
      IRIP_MINIO_REGION: ${IRIP_MINIO_REGION:-us-east-1}
      IRIP_BACKUP_AGE_IDENTITY: ${IRIP_BACKUP_AGE_IDENTITY:-}
      IRIP_RESTORE_SKIP_MIGRATIONS: ${IRIP_RESTORE_SKIP_MIGRATIONS:-false}
      # PITR + mc mirror 相关环境变量
      IRIP_WAL_ARCHIVE_DIR: ${IRIP_WAL_ARCHIVE_DIR:-/backups/wal_archive}
      IRIP_MINIO_MC_ALIAS: ${IRIP_MINIO_MC_ALIAS:-irip}
      IRIP_MINIO_MIRROR_EXCLUDE: ${IRIP_MINIO_MIRROR_EXCLUDE:-}
    volumes:
      - ${IRIP_BACKUP_HOST_DIR:-./backups}:/backups
      # PITR: WAL 归档目录（PITR 恢复时 PG 从此处读取 WAL）
      - ${IRIP_WAL_ARCHIVE_HOST_DIR:-./backups/wal_archive}:/backups/wal_archive
      # PITR: Docker socket（需控制 PG 容器 stop/start）
      - /var/run/docker.sock:/var/run/docker.sock
      # PITR: pgdata 卷（PITR 恢复需写入 PG data 目录）
      - pgdata:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  pgrun:
  miniodata:
  redisdata:
  backups:
