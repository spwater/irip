# IRIP CD Pipeline -- GitHub Actions
# P2-I7: CI 通过后构建镜像 → 推送 registry → 触发 staging 部署 → 手动审批 → 生产部署
#
# 触发条件：main 分支 push（CI 通过后自动触发 staging）
# 生产部署：environment protection rule 审批后手动触发

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---- 构建 & 推送镜像 ----
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318656035d59f971f9b59f4ce5d... # v3

      - name: Log in to Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7ed3... # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf3d2387e... # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            latest

      - name: Build and push API image
        uses: docker/build-push-action@263435318d21b8e681c14... # v6
        with:
          context: .
          file: deployments/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@263435318d21b8e681c14... # v6
        with:
          context: .
          file: deployments/Dockerfile.worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}-worker
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Staging 部署 ----
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: https://staging.irip.local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Deploy to staging
        run: |
          echo "Deploying ${{ github.sha }} to staging environment"
          # 实际部署命令取决于基础设施：
          # - Docker Compose: ssh + docker compose pull && docker compose up -d
          # - K8s: kubectl set image deployment/irip-api api=$IMAGE:${{ github.sha }}
          # - Helm: helm upgrade --install irip ./chart --set image.tag=${{ github.sha }}
          # 占位：根据实际环境配置
          echo "TODO: Replace with actual deployment command"

      - name: Smoke test staging
        run: |
          sleep 10
          # 健康检查
          curl -sf https://staging.irip.local/api/v1/health/live || exit 1
          curl -sf https://staging.irip.local/api/v1/health/ready || exit 1
          echo "Staging smoke test passed"

  # ---- 生产部署（手动审批）----
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://irip.local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Deploy to production
        run: |
          echo "Deploying ${{ github.sha }} to production environment"
          # 同 staging，生产环境需更严格的验证
          echo "TODO: Replace with actual deployment command"

      - name: Smoke test production
        run: |
          sleep 15
          curl -sf https://irip.local/api/v1/health/live || exit 1
          curl -sf https://irip.local/api/v1/health/ready || exit 1
          echo "Production smoke test passed"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Production deployment failed, initiating rollback"
          # 回滚到上一个稳定版本
          echo "TODO: Replace with actual rollback command"
