# IRIP CI Pipeline -- GitHub Actions
# 质量门：ruff lint + mypy typecheck + pytest unit/integration/contract/acceptance + web test/build
# F-17: 测试分类 -- unit job 不跑 DB 测试；integration/contract/acceptance 独立 job
# F-18: Actions pin 到 commit SHA（避免 supply-chain 攻击）
# F-18: SBOM 生成步骤
# H-10: 安全/恢复测试独立 job，不加 marker 过滤

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IRIP_JWT_SECRET: ci-test-secret-2026
  IRIP_BOOTSTRAP_ADMIN_PASSWORD: Admin-IRIP-2026
  IRIP_ENV: test

# F-18: 所有 Actions pin 到 commit SHA（非 tag），防止 supply-chain 攻击
# actions/checkout@v4 -> 11d5960a326750d5838078e36cf38b85af677262
# actions/setup-python@v5 -> a26af69be951a213d495a4c3e4e4022e16d87065
# actions/setup-node@v4 -> 49933ea5288caeca8642d1e84afbd3f7d6820020

jobs:
  lint:
    name: Ruff Lint + Format Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ruff
      - run: ruff check apps packages tests
      # F-24: Ruff format check -- 范围与 Makefile/release-gate 一致
      - run: ruff format --check apps packages tests

  # F-14/T2-8: 错误码穷尽性检查 -- 确保所有被抛出的 AppError code 都在 ErrorCode 枚举中注册
  error-code-check:
    name: Error Code Exhaustiveness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Check error code exhaustiveness
        run: |
          python -c "
          import re, sys, pathlib
          from packages.common.error_codes import ErrorCode

          # 从所有 Python 源文件中提取 AppError(code=\"...\") 的 code 字符串
          code_pattern = re.compile(r'code=[\"\\']([a-z_]+)[\"\\']')
          found_codes = set()
          for pyfile in pathlib.Path('.').rglob('*.py'):
              if '.venv' in str(pyfile) or 'node_modules' in str(pyfile):
                  continue
              if '__pycache__' in str(pyfile):
                  continue
              if 'tests/' in str(pyfile) or str(pyfile).startswith('tests'):
                  continue
              try:
                  text = pyfile.read_text(encoding='utf-8')
              except Exception:
                  continue
              # 只匹配 AppError 调用上下文中的 code=
              for match in code_pattern.finditer(text):
                  # 检查上下文是否在 AppError 构造中
                  start = max(0, match.start() - 200)
                  context = text[start:match.end()]
                  if 'AppError' in context:
                      found_codes.add(match.group(1))

          registered = ErrorCode.all_codes()
          unregistered = found_codes - registered
          if unregistered:
              print(f'ERROR: 以下错误码在代码中被抛出但未在 ErrorCode 枚举中注册:')
              for code in sorted(unregistered):
                  print(f'  - {code}')
              print(f'请在 packages/common/error_codes.py 中注册这些错误码。')
              sys.exit(1)
          else:
              print(f'OK: 所有 {len(found_codes)} 个被抛出的错误码都已在 ErrorCode 枚举中注册。')
          "

  typecheck:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy packages apps/api apps/worker

  # F-17: Unit tests -- 不跑 DB 测试（排除 integration mark）
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # F-17: unit job 不跑需要 DB 的 integration 测试
      - run: python -m pytest tests/unit -v -m "not integration" --cov=packages --cov=apps --cov-report=term-missing --cov-fail-under=30

  # F-17: Contract tests -- 独立 job
  test-contract:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/contract -v

  # H-10: Integration tests -- 独立 job，不加 marker 过滤
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: irip
          POSTGRES_PASSWORD: irip_dev_password
          POSTGRES_DB: irip_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U irip -d irip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: minio/minio:RELEASE.2024-11-07T00-52-20Z
        env:
          MINIO_ROOT_USER: irip
          MINIO_ROOT_PASSWORD: irip_dev_password
        ports:
          - 59000:9000
        # F-16: MinIO 需要 server /data 命令启动
        command: server /data
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      IRIP_TEST_DATABASE_URL: postgresql+psycopg://irip:irip_dev_password@localhost:55432/irip_test
      IRIP_DATABASE_URL: postgresql+psycopg://irip:irip_dev_password@localhost:55432/irip_test
      IRIP_REDIS_URL: redis://localhost:56379/0
      IRIP_MINIO_ENDPOINT: localhost:59000
      IRIP_MINIO_ACCESS_KEY: irip
      IRIP_MINIO_SECRET_KEY: irip_dev_password
      IRIP_MINIO_BUCKET: irip-test
      IRIP_JWT_SECRET: ci-test-secret-2026
      IRIP_BOOTSTRAP_ADMIN_PASSWORD: Admin-IRIP-2026
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m alembic upgrade head
      # H-10: 按目录独立执行，不加 marker 过滤
      - run: python -m pytest tests/integration/ -v --cov=packages --cov=apps --cov-report=term-missing --cov-fail-under=20 --junit-xml=integration-results.xml
      # B-3: Upload JUnit XML for acceptance report generation
      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: integration-test-results
          path: integration-results.xml

