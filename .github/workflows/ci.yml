          node-version: "22"
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # F-18: SBOM（Software Bill of Materials）生成
  # M-11: 从已安装的依赖生成 SBOM，失败时阻断（非零退出），不写空 components
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"
      - name: Generate Python SBOM (CycloneDX)
        run: |
          # cyclonedx-bom v4+ 使用 `env` 子命令，不再依赖 pkg_resources
          pip install 'cyclonedx-bom>=4'
          # M-11: 从已安装的依赖环境生成 SBOM
          cyclonedx-py env -o sbom-python.json
          # M-11: 验证 SBOM 非空且包含组件
          if [ ! -s sbom-python.json ]; then
            echo "ERROR: Python SBOM file is empty"
            exit 1
          fi
          components_count=$(python3 -c "import json; data=json.load(open('sbom-python.json')); print(len(data.get('components', [])))")
          if [ "$components_count" = "0" ]; then
            echo "ERROR: Python SBOM has 0 components — dependencies may not be installed"
            exit 1
          fi
          echo "Python SBOM generated with $components_count components"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - name: Generate Node SBOM (CycloneDX)
        working-directory: apps/web
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile
          # pnpm 的 node_modules 不兼容 npm ls，用 pnpm sbom 生成
          pnpm sbom --sbom-format cyclonedx --out ../sbom-node.json
          # 验证 SBOM 非空且包含组件
          if [ ! -s ../sbom-node.json ]; then
            echo "ERROR: Node SBOM file is empty"
            exit 1
          fi
          components_count=$(python3 -c "import json; data=json.load(open('../sbom-node.json')); print(len(data.get('components', [])))")
          if [ "$components_count" = "0" ]; then
            echo "ERROR: Node SBOM has 0 components — dependencies may not be installed"
            exit 1
          fi
          echo "Node SBOM generated with $components_count components"
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom
          path: |
            sbom-python.json
            sbom-node.json
          retention-days: 30

  # F-16: E2E 测试 -- Playwright 端到端测试，需要完整环境（DB + API + Web）
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: irip
          POSTGRES_PASSWORD: irip_dev_password
          POSTGRES_DB: irip_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U irip -d irip_test"
