      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # B-3: Download JUnit XML artifacts from test jobs for acceptance report
      - name: Download test results
        uses: actions/download-artifact@dcd2f8529f3eb1c6fa6c5e3aaf1d816438656f62  # v4
        with:
          path: test-results
      - name: Generate source code stats
        run: python scripts/generate-stats.py --output deliverables/source-stats.md
      - name: Generate acceptance report
        run: python scripts/generate-acceptance.py --output deliverables/acceptance-report.md
      - name: Upload reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: acceptance-reports
          path: |
            deliverables/source-stats.md
            deliverables/acceptance-report.md
          retention-days: 30
