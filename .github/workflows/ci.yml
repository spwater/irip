# IRIP CI Pipeline — GitHub Actions
# 质量门：ruff lint + mypy typecheck + pytest unit/integration + web test/build

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IRIP_JWT_SECRET: ci-test-secret-2026
  IRIP_BOOTSTRAP_ADMIN_PASSWORD: Admin-IRIP-2026

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check apps packages tests

  typecheck:
    name: Mypy Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy packages apps/api

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/unit -v

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: irip
          POSTGRES_PASSWORD: irip_dev_password
          POSTGRES_DB: irip_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U irip -d irip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: minio/minio:RELEASE.2024-11-07T00-52-20Z
        env:
          MINIO_ROOT_USER: irip
          MINIO_ROOT_PASSWORD: irip_dev_password
        ports:
          - 59000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      IRIP_TEST_DATABASE_URL: postgresql+psycopg://irip:irip_dev_password@localhost:55432/irip_test
      IRIP_DATABASE_URL: postgresql+psycopg://irip:irip_dev_password@localhost:55432/irip_test
      IRIP_REDIS_URL: redis://localhost:56379/0
      IRIP_MINIO_ENDPOINT: localhost:59000
      IRIP_MINIO_ACCESS_KEY: irip
      IRIP_MINIO_SECRET_KEY: irip_dev_password
      IRIP_MINIO_BUCKET: irip-test
      IRIP_JWT_SECRET: ci-test-secret-2026
      IRIP_BOOTSTRAP_ADMIN_PASSWORD: Admin-IRIP-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m alembic upgrade head
      - run: python -m pytest tests/integration tests/recovery tests/security -v

  web-test:
    name: Web Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
