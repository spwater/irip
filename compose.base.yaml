# IRIP 基础编排（全量服务定义，无端口暴露）
# 用法：docker compose -f compose.base.yaml -f compose.development.yaml up -d
#       docker compose -f compose.base.yaml -f compose.production.yaml up -d
#
# 本文件仅定义服务、网络、卷与健康检查，不暴露任何宿主端口。
# 端口映射由 compose.development.yaml / compose.production.yaml 覆盖提供。
#
# H-12/H-13 安全增强：
# - IRIP_SAFE_CLI_MODE=true（CLI 组件沙箱）
# - Redis 加密码
# - 内部服务不暴露宿主端口（postgres/redis/minio 仅 backend 内网）
# - 统一 cap_drop/no-new-privileges/只读 FS 安全基线
# - Docker 日志轮转（max-size: 100m, max-file: 5）防止磁盘耗尽
# - backend 网络 internal: true，禁止容器通过 backend 网络访问外部

# 日志轮转基线（所有服务共享）
x-logging: &logging-base
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

# H-13: 应用服务安全基线（不适用于基础设施 postgres/redis/minio，它们需要写权限）
x-security-base: &security-base
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges"]
  read_only: true
  tmpfs:
    - /tmp

# 基础设施不需要应用层安全限制（它们是受信任的内部服务）
x-infra-security: &infra-security {}

services:
  postgres:
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    logging: *logging-base
    networks:
      - backend
    # PITR: 通过 command 参数注入 WAL 归档配置（无需修改 postgresql.conf）
    command: >
      postgres
      -c archive_mode=on
      -c wal_level=replica
      -c archive_command='test ! -f /backups/wal_archive/%f && cp %p /backups/wal_archive/%f'
      -c max_wal_senders=3
    environment:
      POSTGRES_USER: ${IRIP_DATABASE_USER:-irip}
      # 第6缺陷根治：postgres 官方镜像原生支持 POSTGRES_PASSWORD_FILE，
      # superuser 密码改走 file-backed secret（生产 overlay 挂载 postgres_password）；
      # 开发环境由 compose.development.yaml 额外注入 POSTGRES_PASSWORD（env 优先于 _FILE）。
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${IRIP_DATABASE_NAME:-irip}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgrun:/var/run/postgresql
      # PITR: WAL 归档目录（archive_command 写入此处）
      - ${IRIP_WAL_ARCHIVE_HOST_DIR:-./backups/wal_archive}:/backups/wal_archive
      # PITR: 备份目录（PG 容器需访问 basebackup 产物 + WAL 归档）
      - ${IRIP_BACKUP_HOST_DIR:-./backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IRIP_DATABASE_USER:-irip} -d ${IRIP_DATABASE_NAME:-irip}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: docker.m.daocloud.io/redis:7-alpine
    <<: *infra-security
    logging: *logging-base
    networks:
      - backend
    # H-13: Redis 加密码。
    # 层次2：redis:7-alpine 官方镜像不支持 REDIS_PASSWORD_FILE，用 entrypoint
    # shim 从 /run/secrets/redis_password（生产 overlay 挂载）读入密码；文件缺失
    # 时回退到 IRIP_REDIS_PASSWORD 环境变量（仅 compose.development.yaml 注入）。
    # 两者皆缺失时 fail-closed（拒绝无密码启动）。
    entrypoint:
      - /bin/sh
      - -c
      - >-
        if [ -f /run/secrets/redis_password ]; then
          REDIS_PASSWORD="$$(cat /run/secrets/redis_password)";
        else
          REDIS_PASSWORD="$$IRIP_REDIS_PASSWORD";
        fi;
        if [ -z "$$REDIS_PASSWORD" ]; then
          echo "IRIP_REDIS_PASSWORD or /run/secrets/redis_password is required" >&2;
          exit 1;
        fi;
        exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -f /run/secrets/redis_password ]; then redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping; else redis-cli -a \"$$IRIP_REDIS_PASSWORD\" ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: docker.m.daocloud.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    <<: *infra-security
    logging: *logging-base
    networks:
      - backend
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${IRIP_MINIO_ACCESS_KEY:-irip}
      # 层次2：minio 镜像原生支持 *_FILE，root 密码改走 file-backed secret。
      # 开发环境由 compose.development.yaml 额外注入 MINIO_ROOT_PASSWORD
      # （minio 在两者同设时优先采用环境变量）。
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_secret_key
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deployments/compose/api.Dockerfile
    <<: *security-base
    logging: *logging-base
    networks:
      - frontend
      - backend
    environment:
      # 运行时使用 irip_app（RLS 生效），不使用 superuser。
      # 阶段2 A1：完整连接串（含 irip_app 凭据）改走 file-backed secret，
      # 不再内联密码（见 compose.production.yaml 的 secret 挂载）。
      IRIP_DATABASE_URL_FILE: /run/secrets/database_app_url
      # 层次2：完整 redis URL（含密码）改走 file-backed secret，不再内联密码。
      # Celery broker/result 由 celery_app 复用 IRIP_REDIS_URL，故不再单独设
      # IRIP_CELERY_BROKER_URL / IRIP_CELERY_RESULT_BACKEND。
      IRIP_REDIS_URL_FILE: /run/secrets/redis_url
      IRIP_MINIO_ENDPOINT: http://minio:9000
      IRIP_MINIO_ACCESS_KEY: ${IRIP_MINIO_ACCESS_KEY:-irip}
      IRIP_MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
      IRIP_MINIO_BUCKET: ${IRIP_MINIO_BUCKET:-irip-artifacts}
      IRIP_MINIO_REGION: ${IRIP_MINIO_REGION:-us-east-1}
      IRIP_JWT_SECRET_FILE: /run/secrets/jwt_secret
      IRIP_API_CORS_ORIGINS: ${IRIP_API_CORS_ORIGINS:-http://localhost:8080}
      IRIP_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      IRIP_ALLOW_PRIVATE_NETWORK: ${IRIP_ALLOW_PRIVATE_NETWORK:-0}
      IRIP_MASTER_KEY_FILE: /run/secrets/master_key
      IRIP_SAFE_CLI_MODE: "true"
      IRIP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deployments/compose/api.Dockerfile
    <<: *security-base
    logging: *logging-base
    networks:
      - backend
    command: ["celery", "-A", "apps.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2", "-Q", "irip-fast,irip-normal,irip-research,irip-ops"]
    environment:
      # 运行时使用 irip_app（RLS 生效），不使用 superuser。
      # 阶段2 A1：完整连接串（含 irip_app 凭据）改走 file-backed secret，
      # 不再内联密码（见 compose.production.yaml 的 secret 挂载）。
      IRIP_DATABASE_URL_FILE: /run/secrets/database_app_url
      # 备份/恢复 subprocess 专用 superuser 连接串（pg_basebackup/pg_dump 需全量数据，RLS 会过滤 irip_app）。
      # 阶段2 A1：superuser 连接串改走 file-backed secret，不再内联密码。
      IRIP_DATABASE_ADMIN_URL_FILE: /run/secrets/database_admin_url
      # 层次2：完整 redis URL（含密码）改走 file-backed secret，不再内联密码。
      IRIP_REDIS_URL_FILE: /run/secrets/redis_url
      IRIP_MINIO_ENDPOINT: http://minio:9000
      IRIP_MINIO_ACCESS_KEY: ${IRIP_MINIO_ACCESS_KEY:-irip}
      IRIP_MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
      IRIP_MINIO_BUCKET: ${IRIP_MINIO_BUCKET:-irip-artifacts}
      IRIP_MINIO_REGION: ${IRIP_MINIO_REGION:-us-east-1}
      IRIP_JWT_SECRET_FILE: /run/secrets/jwt_secret
      IRIP_ALLOW_PRIVATE_NETWORK: ${IRIP_ALLOW_PRIVATE_NETWORK:-0}
      IRIP_MASTER_KEY_FILE: /run/secrets/master_key
      IRIP_SAFE_CLI_MODE: "true"
      IRIP_ENV: production
      IRIP_BACKUP_OUTPUT_DIR: ${IRIP_BACKUP_OUTPUT_DIR:-/backups}
      IRIP_BACKUP_AGE_RECIPIENT: ${IRIP_BACKUP_AGE_RECIPIENT:-}
      # PITR + mc mirror 相关环境变量
      IRIP_WAL_ARCHIVE_DIR: ${IRIP_WAL_ARCHIVE_DIR:-/backups/wal_archive}
      IRIP_MINIO_MC_ALIAS: ${IRIP_MINIO_MC_ALIAS:-irip}
      IRIP_PG_REPLICATION_SLOT: ${IRIP_PG_REPLICATION_SLOT:-}
      IRIP_MINIO_MIRROR_EXCLUDE: ${IRIP_MINIO_MIRROR_EXCLUDE:-}
    volumes:
      - ${IRIP_BACKUP_HOST_DIR:-./backups}:/backups
      # PITR: WAL 归档目录（备份/恢复需访问）
      - ${IRIP_WAL_ARCHIVE_HOST_DIR:-./backups/wal_archive}:/backups/wal_archive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9100/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: deployments/compose/api.Dockerfile
    <<: *security-base
    logging: *logging-base
    networks:
      - backend
    command: ["celery", "-A", "apps.worker.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      # 运行时使用 irip_app（RLS 生效），不使用 superuser。
      # 阶段2 A1：完整连接串（含 irip_app 凭据）改走 file-backed secret，
      # 不再内联密码（见 compose.production.yaml 的 secret 挂载）。
      IRIP_DATABASE_URL_FILE: /run/secrets/database_app_url
      # 层次2：完整 redis URL（含密码）改走 file-backed secret，不再内联密码。
      # Celery broker/result 由 celery_app 复用 IRIP_REDIS_URL，故不再单独设
      # IRIP_CELERY_BROKER_URL / IRIP_CELERY_RESULT_BACKEND。
      IRIP_REDIS_URL_FILE: /run/secrets/redis_url
      IRIP_MINIO_ENDPOINT: http://minio:9000
      IRIP_MINIO_ACCESS_KEY: ${IRIP_MINIO_ACCESS_KEY:-irip}
      IRIP_MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
      IRIP_MINIO_BUCKET: ${IRIP_MINIO_BUCKET:-irip-artifacts}
      IRIP_MINIO_REGION: ${IRIP_MINIO_REGION:-us-east-1}
      IRIP_JWT_SECRET_FILE: /run/secrets/jwt_secret
      IRIP_ALLOW_PRIVATE_NETWORK: ${IRIP_ALLOW_PRIVATE_NETWORK:-0}
      IRIP_MASTER_KEY_FILE: /run/secrets/master_key
      IRIP_SAFE_CLI_MODE: "true"
      IRIP_ENV: production
      IRIP_BACKUP_OUTPUT_DIR: ${IRIP_BACKUP_OUTPUT_DIR:-/backups}
      # PITR + mc mirror 相关环境变量
      IRIP_WAL_ARCHIVE_DIR: ${IRIP_WAL_ARCHIVE_DIR:-/backups/wal_archive}
      IRIP_MINIO_MC_ALIAS: ${IRIP_MINIO_MC_ALIAS:-irip}
      IRIP_PG_REPLICATION_SLOT: ${IRIP_PG_REPLICATION_SLOT:-}
      IRIP_MINIO_MIRROR_EXCLUDE: ${IRIP_MINIO_MIRROR_EXCLUDE:-}
    volumes:
      - ${IRIP_BACKUP_HOST_DIR:-./backups}:/backups
      # PITR: WAL 归档目录（beat 任务可能需要查询 WAL 状态）
      - ${IRIP_WAL_ARCHIVE_HOST_DIR:-./backups/wal_archive}:/backups/wal_archive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule && find /tmp/celerybeat-schedule -mmin -2 | grep -q . || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deployments/compose/web.Dockerfile
    <<: *security-base
    logging: *logging-base
    networks:
      - frontend
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  bootstrap:
    build:
      context: .
      dockerfile: deployments/compose/api.Dockerfile
    <<: *security-base
    logging: *logging-base
    networks:
      - backend
    # 先跑 alembic 迁移建表，再跑 bootstrap 创建组织+角色+管理员+bucket
    command: ["sh", "-c", "alembic upgrade head && python -m deployments.compose.bootstrap"]
    environment:
      # 阶段2 A1：bootstrap 用 superuser（irip）做 DDL + 建角色/组织，连接串走 file-backed secret。
      IRIP_DATABASE_URL_FILE: /run/secrets/database_admin_url
      IRIP_REDIS_URL_FILE: /run/secrets/redis_url
      IRIP_MINIO_ENDPOINT: http://minio:9000
      IRIP_MINIO_ACCESS_KEY: ${IRIP_MINIO_ACCESS_KEY:-irip}
      IRIP_MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
      IRIP_MINIO_BUCKET: ${IRIP_MINIO_BUCKET:-irip-artifacts}
      IRIP_MINIO_REGION: ${IRIP_MINIO_REGION:-us-east-1}
      IRIP_JWT_SECRET_FILE: /run/secrets/jwt_secret
      IRIP_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      IRIP_MASTER_KEY_FILE: /run/secrets/master_key
      # 运行时角色密码：bootstrap 用该 secret 重设 irip_app 密码（覆盖迁移 0071
      # 硬编码弱密钥）；api/worker/scheduler 用 database_app_url 中的同值密码连接。
      IRIP_DATABASE_APP_PASSWORD_FILE: /run/secrets/database_app_password
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

  backup:
    profiles: ["dangerous-ops"]
    build:
      context: .
      dockerfile: deployments/compose/ops.Dockerfile
    <<: *security-base
    logging: *logging-base
    networks:
      - backend
    command: ["python", "-m", "deployments.compose.backup"]
    environment:
      # 阶段2 A1：备份使用 superuser 连接，改走 file-backed secret。
      IRIP_DATABASE_ADMIN_URL_FILE: /run/secrets/database_admin_url
      IRIP_REDIS_URL_FILE: /run/secrets/redis_url
      IRIP_MINIO_ENDPOINT: http://minio:9000
      IRIP_MINIO_ACCESS_KEY: ${IRIP_MINIO_ACCESS_KEY:-irip}
      IRIP_MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
      IRIP_MINIO_BUCKET: ${IRIP_MINIO_BUCKET:-irip-artifacts}
      IRIP_MINIO_REGION: ${IRIP_MINIO_REGION:-us-east-1}
      IRIP_APPLICATION_VERSION: ${IRIP_APPLICATION_VERSION:-0.8.0}
      IRIP_BACKUP_OUTPUT_DIR: ${IRIP_BACKUP_OUTPUT_DIR:-/backups}
      IRIP_BACKUP_AGE_RECIPIENT: ${IRIP_BACKUP_AGE_RECIPIENT:-}
      # PITR + mc mirror 相关环境变量
      IRIP_WAL_ARCHIVE_DIR: ${IRIP_WAL_ARCHIVE_DIR:-/backups/wal_archive}
      IRIP_MINIO_MC_ALIAS: ${IRIP_MINIO_MC_ALIAS:-irip}
      IRIP_PG_REPLICATION_SLOT: ${IRIP_PG_REPLICATION_SLOT:-}
      IRIP_MINIO_MIRROR_EXCLUDE: ${IRIP_MINIO_MIRROR_EXCLUDE:-}
    volumes:
      - ${IRIP_BACKUP_HOST_DIR:-./backups}:/backups
      # PITR: WAL 归档目录（备份时可能需要查询 WAL 状态）
      - ${IRIP_WAL_ARCHIVE_HOST_DIR:-./backups/wal_archive}:/backups/wal_archive
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

  restore:
    profiles: ["dangerous-ops"]
    build:
      context: .
      dockerfile: deployments/compose/ops.Dockerfile
    <<: *security-base
    logging: *logging-base
    networks:
      - backend
    command: ["python", "-m", "deployments.compose.restore"]
    environment:
      # 阶段2 A1：恢复使用 superuser 连接，改走 file-backed secret。
      IRIP_DATABASE_ADMIN_URL_FILE: /run/secrets/database_admin_url
      IRIP_REDIS_URL_FILE: /run/secrets/redis_url
      IRIP_MINIO_ENDPOINT: http://minio:9000
      IRIP_MINIO_ACCESS_KEY: ${IRIP_MINIO_ACCESS_KEY:-irip}
      IRIP_MINIO_SECRET_KEY_FILE: /run/secrets/minio_secret_key
      IRIP_MINIO_BUCKET: ${IRIP_MINIO_BUCKET:-irip-artifacts}
      IRIP_MINIO_REGION: ${IRIP_MINIO_REGION:-us-east-1}
      IRIP_BACKUP_AGE_IDENTITY: ${IRIP_BACKUP_AGE_IDENTITY:-}
      IRIP_RESTORE_SKIP_MIGRATIONS: ${IRIP_RESTORE_SKIP_MIGRATIONS:-false}
      # PITR + mc mirror 相关环境变量
      IRIP_WAL_ARCHIVE_DIR: ${IRIP_WAL_ARCHIVE_DIR:-/backups/wal_archive}
      IRIP_MINIO_MC_ALIAS: ${IRIP_MINIO_MC_ALIAS:-irip}
      IRIP_MINIO_MIRROR_EXCLUDE: ${IRIP_MINIO_MIRROR_EXCLUDE:-}
    volumes:
      - ${IRIP_BACKUP_HOST_DIR:-./backups}:/backups
      # PITR: WAL 归档目录（PITR 恢复时 PG 从此处读取 WAL）
      - ${IRIP_WAL_ARCHIVE_HOST_DIR:-./backups/wal_archive}:/backups/wal_archive
      # PITR: pgdata 卷（PITR 恢复需写入 PG data 目录）
      # 安全说明：Docker socket 不再挂载。服务的停启由宿主编排脚本
      # （scripts/ops/restore.sh）负责，restore 容器仅执行纯数据操作。
      - pgdata:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

  # ============================================================
  # P2-I8: 日志聚合系统（Loki + Promtail）
  # 通过 profiles: monitoring 控制，仅在生产/监控环境启动
  # structlog JSON 输出已就绪，Promtail 从 Docker 容器日志采集
  # ============================================================
  loki:
    profiles: ["monitoring"]
    image: docker.m.daocloud.io/grafana/loki:3.2.1
    <<: *infra-security
    logging: *logging-base
    networks:
      - backend
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    profiles: ["monitoring"]
    image: docker.m.daocloud.io/grafana/promtail:3.2.1
    <<: *infra-security
    logging: *logging-base
    networks:
      - backend
    volumes:
      # docker_sd 采集依赖 Docker socket 枚举容器 + 读取容器元数据/日志。
      # 原 /var/lib/docker/containers 挂载仅适用于 Linux 宿主（Docker Desktop
      # macOS 下该路径不存在，属死配置）；改用只读 socket 才是跨平台正解。
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - ./deployments/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  # P2-I2: PgBouncer 连接池代理
  # transaction-level pooling，减少 PostgreSQL 连接数
  # 注意：RLS GUC SET LOCAL 在 transaction-level 模式下兼容
  # （SET LOCAL 在事务结束时自动重置，PgBouncer transaction 模式正好匹配此行为）
  pgbouncer:
    profiles: ["pooling"]
    image: docker.m.daocloud.io/edoburu/pgbouncer:1.23.1
    <<: *infra-security
    logging: *logging-base
    networks:
      - backend
    # 阶段2 A1：DB_PASSWORD 走 file-backed secret（irip_app 密码）。
    # edoburu/pgbouncer 镜像不支持 *_FILE 环境变量，用 entrypoint shim 从
    # /run/secrets/database_app_password 读入并导出 DB_PASSWORD，再 exec 原 entrypoint。
    entrypoint:
      - /bin/sh
      - -c
      - 'DB_PASSWORD=$(cat /run/secrets/database_app_password); export DB_PASSWORD; exec /entrypoint.sh "$@"'
      - pgbouncer-shim
    # 显式声明 command：Docker Compose 覆盖 entrypoint（list 形式）时会丢弃镜像 CMD，
    # 导致 shim 的 "$@" 为空、pgbouncer 进程无法启动（容器退出码 0 后 restart 循环）。
    # 此处显式透传镜像默认 CMD（edoburu/pgbouncer 镜像是 /usr/bin/pgbouncer + config 路径）。
    command: ["/usr/bin/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      # 角色/密码匹配：irip_app 配 app password；不再注入 DB_PASSWORD（由 shim 从 secret 读）
      DB_USER: ${IRIP_DATABASE_APP_USER:-irip_app}
      DB_NAME: ${IRIP_DATABASE_NAME:-irip}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      SERVER_RESET_QUERY: DISCARD ALL
      AUTH_TYPE: scram-sha-256
      LISTEN_ADDR: "*"
      LISTEN_PORT: 6432
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # P2-I9: 分布式追踪（Jaeger）
  # 接收 OTLP gRPC (4317) / HTTP (4318)，UI 在 16686
  jaeger:
    profiles: ["monitoring"]
    image: docker.m.daocloud.io/jaegertracing/all-in-one:1.62.0
    <<: *infra-security
    logging: *logging-base
    networks:
      - backend
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

networks:
  # 不设置显式 name，让 compose 按 <project>_<network> 自动前缀化，
  # 使 `-p <project>` 能隔离网络层（staging/drill/生产同机不再 host 名冲突）。
  frontend:
  backend:
    internal: true

volumes:
  pgdata:
  pgrun:
  miniodata:
  redisdata:
  backups:
  # P2-I8: Loki 日志存储
  loki-data:
